scenario:
  name: linear_three_nodes

  simulation:
    duration_s: 0.1      # seconds, total simulation stop time
    seed: 42

  nodes:
    - id: A
      type: quantum_router
      memories: 10

    - id: R1
      type: quantum_router
      memories: 20

    - id: B
      type: quantum_router
      memories: 10

  quantum_links:
    - source: A
      destination: R1
      distance_m: 5000
      attenuation_db_per_m: 0.00002

    - source: R1
      destination: B
      distance_m: 5000
      attenuation_db_per_m: 0.00002

  classical_delay_s: 0.0001

  intents:
    - file: intents/intent_001.yaml
