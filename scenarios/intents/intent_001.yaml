intent:
  id: intent-001
  service: entanglement_distribution

  endpoints:
    source: A
    destination: B

  requirements:
    min_fidelity: 0.65
    min_throughput: 10
    max_latency: 0.5
    requested_pairs: 10
    start_time: 0.01
    duration: 0.05

  policy:
    priority: normal
    allow_rerouting: true
    allow_purification: true
    allow_multiple_paths: false

  validation:
    metrics:
      - delivered_pairs
      - average_fidelity
    success_conditions:
      delivered_pairs: ">= 10"
      average_fidelity: ">= 0.65"
