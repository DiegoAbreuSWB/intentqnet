scenario:
  name: three_node
  simulation:
    duration_s: 0.3      # generous stop_time; C02/C03 sweep duration_s up to 0.1 with start_time 0.02
    seed: 0              # overridden per trial by the campaign runner
  nodes:
    - id: a
      memories: 10
      raw_fidelity: 0.85
    - id: r
      memories: 20
      raw_fidelity: 0.85
      swapping_degradation: 0.95
    - id: b
      memories: 10
      raw_fidelity: 0.85
  quantum_links:
    - source: a
      destination: r
      distance_m: 1000
      attenuation_db_per_m: 0.00001
    - source: r
      destination: b
      distance_m: 1000
      attenuation_db_per_m: 0.00001
  classical_delay_s: 0.0001
  intents:
    - file: ../intents/three_node_intent.yaml
