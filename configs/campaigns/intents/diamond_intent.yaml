intent:
  id: intent-diamond
  service: entanglement_distribution
  endpoints:
    source: r1
    destination: r3
  requirements:
    min_fidelity: 0.6
    min_throughput: 1
    max_latency: 1.0
    min_delivered_pairs: 10
  resources:
    reserved_memory_slots: 10
  time:
    start_time_s: 0.02
    duration_s: 0.1
  policy:
    priority: normal
    allow_rerouting: true
    allow_purification: true
    allow_multiple_paths: false
  validation:
    metrics:
      - delivered_pairs
    success_conditions:
      delivered_pairs: ">= 10"
