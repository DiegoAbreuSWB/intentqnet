campaign:
  name: C01_routing_strategy
  description: >
    Compares ShortestHopCountRouting, LeastLossRouting and HighestFidelityRouting
    on the diamond topology (see docs/campaign_architecture.md), where they
    genuinely disagree (notebooks 12/16 of Fase H2). Deliberately does NOT sweep
    attenuation_db_per_m here: the current sweep mechanism applies a swept
    topology parameter to every quantum link uniformly, which would erase the
    diamond's deliberate bad/good link asymmetry (the whole reason the three
    strategies diverge) instead of scaling it. A per-link-targeted sweep would
    be needed to vary attenuation meaningfully on this topology - out of scope
    for this validation campaign (see docs/campaign_architecture.md, limitations).
  scenario_file: scenarios/diamond.yaml
  intents:
    - intents/diamond_intent.yaml
  seeds: [0, 1000, 2000]
  strategies:
    routing: [shortest_hop_count, least_loss, highest_fidelity]
  output_directory: results
  execution:
    continue_on_error: true
    resume: true
