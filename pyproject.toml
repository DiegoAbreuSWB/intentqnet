[project]
name = "ibqn"
version = "0.1.0"
description = "Intent-Based Quantum Networking management layer on top of SeQUeNCe"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: deterministic unit tests with fixed seeds",
    "probabilistic: statistical tests that run multiple seeds/repetitions",
]
